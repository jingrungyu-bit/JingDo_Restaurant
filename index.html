<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>金都餐廳 — 線上菜單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:    #7B1A2E;
  --primary-dk: #540f1e;
  --gold:       #C8A44A;
  --gold-lt:    #f8f0dc;
  --bg:         #f7f5f2;
  --card:       #ffffff;
  --text:       #1a1a1a;
  --muted:      #888;
  --border:     rgba(0,0,0,0.08);
  --radius:     16px;
  --lang-h:     44px;
  --cat-h:      48px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 430px;
  margin: 0 auto;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

/* ── LANG BAR ── */
#lang-bar {
  position: sticky; top: 0; z-index: 100;
  display: flex; background: var(--primary-dk);
  padding: 0 8px; height: var(--lang-h);
}
#lang-bar button {
  flex: 1; border: none; background: none;
  color: rgba(255,255,255,0.5);
  font-size: 13px; font-family: inherit; font-weight: 500;
  padding: 0 4px; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .2s, border-color .2s;
  white-space: nowrap;
}
#lang-bar button.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── HERO ── */
#hero {
  background: linear-gradient(175deg, var(--primary-dk) 0%, var(--primary) 100%);
  padding: 32px 24px 28px;
  text-align: center; position: relative; overflow: hidden;
}
#hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
    transparent 1px, transparent 28px
  );
  pointer-events: none;
}
.hero-medallion {
  width: 76px; height: 76px; border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: 1.5px solid rgba(200,164,74,0.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 38px; margin: 0 auto 16px; position: relative;
}
#hero-name {
  font-size: 36px; font-weight: 900; color: #fff;
  letter-spacing: 4px; position: relative;
}
#hero-tagline {
  font-size: 13px; color: var(--gold);
  letter-spacing: 3px; text-transform: uppercase;
  margin-top: 6px; position: relative;
}
#hero-divider {
  width: 48px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,164,74,0.5), transparent);
  margin: 18px auto 16px; position: relative;
}
#hero-info { display: flex; flex-direction: column; gap: 8px; position: relative; }
.info-row {
  display: flex; align-items: center; justify-content: center;
  gap: 7px; color: rgba(255,255,255,0.7); font-size: 15px;
  text-decoration: none;
}
.info-row:hover { color: #fff; }
.info-row .ico { font-size: 14px; }

/* ── CAT BAR ── */
#cat-bar {
  position: sticky; top: var(--lang-h); z-index: 90;
  display: flex; background: var(--card);
  border-bottom: 1px solid var(--border);
  height: var(--cat-h);
  overflow-x: auto; scrollbar-width: none;
}
#cat-bar::-webkit-scrollbar { display: none; }
#cat-bar button {
  flex: 1; min-width: 0; border: none; background: none;
  font-family: inherit; font-size: 14px; font-weight: 500;
  color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .2s, border-color .2s;
  white-space: nowrap; padding: 0 6px;
}
#cat-bar button.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ── CONTENT ── */
#content { padding: 20px 16px 60px; display: flex; flex-direction: column; gap: 28px; }

.cat-section { display: flex; flex-direction: column; gap: 12px; }
.cat-label {
  font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: 2px; text-transform: uppercase; padding: 0 2px;
}

/* ── CARD ── */
.menu-card {
  background: var(--card); border-radius: var(--radius);
  overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.07);
  cursor: pointer;
  transition: transform .18s, box-shadow .18s;
  -webkit-tap-highlight-color: transparent;
}
.menu-card:active { transform: scale(0.985); box-shadow: 0 1px 6px rgba(0,0,0,0.06); }

.card-img {
  width: 100%; aspect-ratio: 16/9;
  object-fit: cover; display: block;
}
.card-emoji-bg {
  width: 100%; aspect-ratio: 16/9;
  background: var(--gold-lt);
  display: flex; align-items: center; justify-content: center;
  font-size: 64px;
}
.card-body { padding: 18px 18px 20px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.card-name { font-size: 26px; font-weight: 700; }
.card-price { font-size: 26px; font-weight: 700; color: var(--gold); white-space: nowrap; margin-left: 12px; }
.card-people { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.includes-header {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; color: var(--primary);
  letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px;
}
.includes-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.dish-list { display: flex; flex-direction: column; gap: 6px; }
.dish-item { display: flex; align-items: center; gap: 9px; font-size: 16px; color: #3a3a3a; line-height: 1.5; }
.dish-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

/* ── MODAL ── */
#modal {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6);
  align-items: flex-end; justify-content: center;
}
#modal.open { display: flex; }
#modal-sheet {
  background: var(--card); border-radius: 22px 22px 0 0;
  width: 100%; max-width: 430px;
  max-height: 92dvh; overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
#modal-img-wrap {
  position: relative; width: 100%;
  overflow: hidden; touch-action: pinch-zoom;
}
#modal-img-wrap img {
  width: 100%; aspect-ratio: 4/3;
  object-fit: cover; display: block;
  transform-origin: center; touch-action: pinch-zoom;
}
#modal-emoji-lg {
  width: 100%; aspect-ratio: 4/3;
  background: var(--gold-lt);
  display: flex; align-items: center; justify-content: center;
  font-size: 100px;
}
#modal-close {
  position: absolute; top: 12px; right: 12px;
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  color: #fff; font-size: 18px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 10;
}
#modal-body { padding: 22px 20px 40px; }
#modal-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
#modal-name { font-size: 30px; font-weight: 700; }
#modal-price { font-size: 30px; font-weight: 700; color: var(--gold); margin-left: 12px; white-space: nowrap; }
#modal-subline { font-size: 15px; color: var(--muted); margin-bottom: 18px; }
.modal-includes-hd {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; color: var(--primary);
  letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px;
}
.modal-includes-hd::after { content: ''; flex: 1; height: 1px; background: var(--border); }
#modal-dishes { display: flex; flex-direction: column; gap: 8px; }
.mdish {
  display: flex; align-items: center; gap: 12px;
  font-size: 17px; color: var(--text); line-height: 1.5;
  background: var(--bg); border-radius: 10px; padding: 10px 14px;
}
.mdish-num {
  min-width: 24px; height: 24px; border-radius: 50%;
  background: var(--primary); color: #fff;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
#modal-note {
  margin-top: 14px; font-size: 14px; color: var(--muted);
  line-height: 1.65; padding: 12px 14px;
  background: var(--bg); border-radius: 10px;
}
</style>
</head>
<body>

<!-- Language bar -->
<div id="lang-bar">
  <button data-lang="zh" class="active">繁中</button>
  <button data-lang="en">EN</button>
  <button data-lang="ja">日本語</button>
  <button data-lang="ko">한국어</button>
</div>

<!-- Hero -->
<div id="hero">
  <div class="hero-medallion">🏮</div>
  <div id="hero-name"></div>
  <div id="hero-tagline"></div>
  <div id="hero-divider"></div>
  <div id="hero-info">
    <span class="info-row"><span class="ico">📍</span><span id="addr-text"></span></span>
    <a class="info-row" id="phone-link" href="tel:049-299-5096"><span class="ico">📞</span><span id="phone-text"></span></a>
    <span class="info-row"><span class="ico">💬</span><span id="line-text"></span></span>
  </div>
</div>

<!-- Category tabs -->
<div id="cat-bar"></div>

<!-- Menu sections -->
<div id="content"></div>

<!-- Modal -->
<div id="modal" role="dialog" aria-modal="true">
  <div id="modal-sheet">
    <div id="modal-img-wrap">
      <button id="modal-close" aria-label="關閉">✕</button>
    </div>
    <div id="modal-body">
      <div id="modal-top">
        <div id="modal-name"></div>
        <div id="modal-price"></div>
      </div>
      <div id="modal-subline"></div>
      <div class="modal-includes-hd" id="modal-inc-hd"></div>
      <div id="modal-dishes"></div>
      <div id="modal-note" style="display:none"></div>
    </div>
  </div>
</div>

<script src="menu-data.js"></script>
<script>
(function () {
  'use strict';

  let lang = localStorage.getItem('lang') || 'zh';
  let savedScroll = 0;

  /* ── RENDER HERO ── */
  function renderHero() {
    document.getElementById('hero-name').textContent    = RESTAURANT.name[lang];
    document.getElementById('hero-tagline').textContent = RESTAURANT.tagline[lang];
    document.getElementById('addr-text').textContent    = RESTAURANT.address[lang];
    document.getElementById('phone-text').textContent   = RESTAURANT.phone;
    document.getElementById('line-text').textContent    = 'LINE: ' + RESTAURANT.line;
    document.getElementById('phone-link').href          = 'tel:' + RESTAURANT.phone;
  }

  /* ── RENDER CAT BAR ── */
  function renderCatBar() {
    const bar = document.getElementById('cat-bar');
    bar.innerHTML = CATEGORIES.map(c =>
      `<button data-cat="${c.id}">${c.label[lang]}</button>`
    ).join('');
    bar.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => scrollToCat(btn.dataset.cat));
    });
    syncCatActive();
  }

  /* ── RENDER CONTENT ── */
  function renderContent() {
    const content = document.getElementById('content');
    content.innerHTML = CATEGORIES.map(cat => {
      const items = MENU_ITEMS.filter(i => i.category === cat.id);
      return `<div class="cat-section" id="sec-${cat.id}">
        <div class="cat-label">${cat.label[lang]}</div>
        ${items.map(renderCard).join('')}
      </div>`;
    }).join('');
    content.querySelectorAll('.menu-card').forEach(card => {
      card.addEventListener('click', () => openModal(card.dataset.id));
    });
  }

  function renderCard(item) {
    const imgHtml = item.image
      ? `<img class="card-img" src="${item.image}" alt="${item.names[lang]}" loading="lazy">`
      : `<div class="card-emoji-bg">${item.emoji}</div>`;
    const dishes = item.dishes[lang].map(d =>
      `<div class="dish-item"><span class="dish-dot"></span>${d}</div>`
    ).join('');
    const people = SET_PEOPLE[item.category] || 1;
    const pLabel = PEOPLE_LABEL[lang](people);

    return `<div class="menu-card" data-id="${item.id}">
      ${imgHtml}
      <div class="card-body">
        <div class="card-top">
          <div class="card-name">${item.names[lang]}</div>
          <div class="card-price">NT$${item.price.toLocaleString()}</div>
        </div>
        <div class="card-people">${pLabel}</div>
        <div class="includes-header">${INCLUDES_LABEL[lang]}</div>
        <div class="dish-list">${dishes}</div>
      </div>
    </div>`;
  }

  /* ── MODAL ── */
  function openModal(id) {
    const item = MENU_ITEMS.find(i => i.id === id);
    if (!item) return;
    savedScroll = window.scrollY;

    const wrap = document.getElementById('modal-img-wrap');
    const closeBtn = document.getElementById('modal-close');
    wrap.querySelectorAll('img, #modal-emoji-lg').forEach(el => el.remove());

    if (item.image) {
      const img = new Image();
      img.src = item.image;
      img.alt = item.names[lang];
      img.style.cssText = 'width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transform-origin:center;touch-action:pinch-zoom;';
      wrap.insertBefore(img, closeBtn);
      setupPinch(img, wrap);
    } else {
      const em = document.createElement('div');
      em.id = 'modal-emoji-lg';
      em.textContent = item.emoji;
      wrap.insertBefore(em, closeBtn);
    }

    document.getElementById('modal-name').textContent  = item.names[lang];
    document.getElementById('modal-price').textContent = `NT$${item.price.toLocaleString()}`;

    const people = SET_PEOPLE[item.category] || 1;
    document.getElementById('modal-subline').textContent = PEOPLE_LABEL[lang](people);
    document.getElementById('modal-inc-hd').textContent  = INCLUDES_LABEL[lang];

    document.getElementById('modal-dishes').innerHTML = item.dishes[lang].map((d, i) =>
      `<div class="mdish"><span class="mdish-num">${i + 1}</span>${d}</div>`
    ).join('');

    const noteEl = document.getElementById('modal-note');
    if (item.note && item.note[lang]) {
      noteEl.textContent   = item.note[lang];
      noteEl.style.display = '';
    } else {
      noteEl.style.display = 'none';
    }

    const modal = document.getElementById('modal');
    modal.classList.add('open');
    modal.dataset.itemId = id;
    document.getElementById('modal-sheet').scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
    window.scrollTo(0, savedScroll);
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  /* ── PINCH-TO-ZOOM ── */
  function setupPinch(img, wrap) {
    let scale = 1, lastDist = 0;
    wrap.addEventListener('touchmove', function (e) {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx   = e.touches[0].pageX - e.touches[1].pageX;
        const dy   = e.touches[0].pageY - e.touches[1].pageY;
        const dist = Math.hypot(dx, dy);
        if (lastDist > 0) {
          scale = Math.min(Math.max(scale * (dist / lastDist), 1), 4);
          img.style.transform = `scale(${scale})`;
        }
        lastDist = dist;
      }
    }, { passive: false });
    wrap.addEventListener('touchend', function (e) {
      if (e.touches.length < 2) {
        lastDist = 0;
        if (scale <= 1.05) { scale = 1; img.style.transform = ''; }
      }
    });
  }

  /* ── CATEGORY SCROLL ── */
  function scrollToCat(catId) {
    const el = document.getElementById('sec-' + catId);
    if (!el) return;
    const offset = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--lang-h')) +
                   parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cat-h')) + 12;
    const top = el.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({ top, behavior: 'smooth' });
  }

  function syncCatActive() {
    const offset = 44 + 48 + 60;
    let active = CATEGORIES[0].id;
    CATEGORIES.forEach(cat => {
      const el = document.getElementById('sec-' + cat.id);
      if (el && el.getBoundingClientRect().top <= offset) active = cat.id;
    });
    document.querySelectorAll('#cat-bar button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.cat === active);
    });
  }

  window.addEventListener('scroll', syncCatActive, { passive: true });

  /* ── LANGUAGE SWITCH ── */
  function setLang(l) {
    lang = l;
    localStorage.setItem('lang', l);
    document.documentElement.lang = l === 'zh' ? 'zh-TW' : l === 'ja' ? 'ja' : l === 'ko' ? 'ko' : 'en';
    document.querySelectorAll('#lang-bar button').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === l)
    );
    renderHero();
    renderCatBar();
    renderContent();
    const modal = document.getElementById('modal');
    if (modal.classList.contains('open') && modal.dataset.itemId) {
      openModal(modal.dataset.itemId);
    }
  }

  document.querySelectorAll('#lang-bar button').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
  });

  /* ── INIT ── */
  setLang(lang);
})();
</script>
</body>
</html>
